# App Store の紹介動画（App プレビュー）の素材：本物のアプリを UI テストで操作し、シミュレータの画面を録画する。
# 結果は Artifacts「preview-video」（raw.mp4）。編集（文字入れ・長さ調整）は別に行う。
name: Preview Video

on:
  push:
    branches: [main]
    paths:
      - UITests/**
      - .github/workflows/preview-video.yml
  workflow_dispatch:

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make mask with Vision (macOS)
        run: |
          mkdir -p demo
          swift scripts/make-mask.swift ScreenshotAssets/demo_photo.jpg demo
          cp ScreenshotAssets/demo_photo.jpg demo/

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for testing (iPhone 6.9-inch simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if "Pro Max" in d["name"]))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project SakuhinCamera.xcodeproj \
            -scheme PreviewVideo \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SakuhinCamera.app
          xcrun simctl privacy "$UDID" grant camera com.sammy.sakuhincamera || true
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4
          DATA=$(xcrun simctl get_app_container "$UDID" com.sammy.sakuhincamera data)
          mkdir -p "$DATA/Documents"
          cp demo/demo_photo.jpg demo/demo_mask.raw demo/demo_labels.raw "$DATA/Documents/"

      - name: Record while running the UI test
        run: |
          mkdir -p video/stills
          xcrun simctl io "$UDID" recordVideo --codec=hevc --force video/raw.mov &
          REC=$!
          # 録画が止まっていないか確かめるため、3秒ごとに静止画も撮る
          ( i=0; while true; do xcrun simctl io "$UDID" screenshot "video/stills/$(printf %03d $i).png" >/dev/null 2>&1; i=$((i+1)); sleep 3; done ) &
          STILLS=$!
          sleep 3
          set +e
          xcodebuild test-without-building \
            -project SakuhinCamera.xcodeproj \
            -scheme PreviewVideo \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath video/result.xcresult
          STATUS=$?
          sleep 2
          kill $STILLS || true
          kill -INT $REC
          wait $REC
          ls -la video
          exit $STATUS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-video
          path: |
            video/raw.mov
            video/stills
